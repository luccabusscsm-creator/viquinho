<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vingança</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#000,#1a0000,#300000);
      font-family:Arial, sans-serif;
      overflow:hidden;
    }

    .box{
      text-align:center;
      background:rgba(0,0,0,0.8);
      padding:50px;
      border-radius:20px;
      box-shadow:0 0 25px red;
      border:2px solid red;
    }

    h1{
      color:red;
      font-size:50px;
      text-shadow:0 0 15px red;
      margin-bottom:30px;
    }

    button{
      padding:20px 40px;
      font-size:24px;
      font-weight:bold;
      border:none;
      border-radius:15px;
      cursor:pointer;
      background:red;
      color:white;
      transition:0.3s;
      box-shadow:0 0 20px red;
    }

    button:hover{
      transform:scale(1.1);
      background:darkred;
      box-shadow:0 0 40px red;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>VINGANÇA</h1>

    <button onclick="abrirArquivoX()">
      ☠ Arquivo X ☠
    </button>
  </div>

  <script>
    function abrirArquivoX(){
      window.location.href = "https://www.baixaki.com.br/apps/antivirus/trojan-killer/windows";
    }
  </script>

</body>
</html>
